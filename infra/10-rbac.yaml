apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: ofan
  name: ofan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: ofan-endpointslice-reader
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ofan-read-endpointslice
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ofan
    namespace: ofan
roleRef:
  kind: Role
  name: ofan-endpointslice-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ofan-games
  name: ofan-manager
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: ofan-games
  name: ofan-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ofan-manager
subjects:
  - kind: ServiceAccount
    name: ofan
    namespace: ofan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ofan-namespace-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ofan-namespace-manager-binding
subjects:
  - kind: ServiceAccount
    name: ofan
    namespace: ofan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ofan-namespace-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ofan-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ofan-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: ofan
    namespace: ofan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ofan-node-reader
