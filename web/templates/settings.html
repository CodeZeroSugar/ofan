{{define "settings"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/htmx.min.js"></script>
    <script src="/static/json-enc.js"></script>
    <script src="/static/js/ui.js"></script>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link href="/static/css/output.css" rel="stylesheet" />
    <title>{{ .Title }}</title>
  </head>
  <body id="screen-wrapper" class="min-h-screen bg-zinc-900 text-neutral-50">
    <div class="flex min-h-screen flex-col md:flex-row">
      {{template "sidebar" .}}
      <div class="flex-1">
        <main class="mx-auto w-full max-w-5xl p-6">
          <h2 class="mb-4 text-2xl font-bold text-neutral-50">{{ .Title }}</h2>
          <div
            class="mb-4 w-full max-w-md card p-6"
          >
            <h3 class="section-title">Account</h3>
            <div class="flex flex-col gap-2 text-sm">
              <div class="flex items-center justify-between gap-3">
                <span class="text-zinc-400">Username</span>
                <span class="font-medium text-neutral-50">{{ .Username }}</span>
              </div>
              <div class="flex items-center justify-between gap-3">
                <span class="text-zinc-400">Role</span>
                {{if .IsAdmin}}
                <span
                  class="rounded-full bg-zinc-600 px-3 py-1 text-xs font-semibold text-zinc-100"
                  >admin</span
                >
                {{else}}
                <span
                  class="rounded-full bg-zinc-700 px-3 py-1 text-xs font-semibold text-zinc-300"
                  >user</span
                >
                {{end}}
              </div>
            </div>
          </div>
          <div
            class="w-full max-w-md card p-6"
          >
            <h3 class="section-title">Change Password</h3>
            <form id="change-password-form" class="flex flex-col gap-4">
              <div>
                <label
                  for="new-password"
                  class="label"
                  >New Password</label
                >
                <input
                  class="field"
                  type="password"
                  id="new-password"
                  name="new_password"
                  minlength="5"
                  required
                />
              </div>
              <button
                type="submit"
                class="btn-primary w-full"
              >
                Change Password
              </button>
              <div
                id="change-password-message"
                class="text-center text-sm font-medium"
              ></div>
            </form>
          </div>
        </main>
      </div>
    </div>
    <script>
      document
        .getElementById("change-password-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          var msg = document.getElementById("change-password-message");
          ofan.busy(document.querySelector('#change-password-form button[type="submit"]'), true);
          fetch("/api/v1/auth/password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              new_password: document.getElementById("new-password").value,
            }),
          }).then(function (resp) {
            ofan.busy(document.querySelector('#change-password-form button[type="submit"]'), false);
            if (resp.status !== 200) {
              resp.text().then(function (text) {
                msg.textContent = text;
                msg.classList.add("text-red-500");
                msg.classList.remove("text-emerald-400");
              });
              return;
            }
            document.getElementById("change-password-form").reset();
            ofan.toast("Password changed", true);
            msg.textContent = "password changed";
            msg.classList.remove("text-red-500");
            msg.classList.add("text-emerald-400");
          });
        });
    </script>
  </body>
</html>
{{end}}
