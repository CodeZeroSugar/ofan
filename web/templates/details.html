{{define "details"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/htmx.min.js"></script>
    <script src="/static/json-enc.js"></script>
    <script src="/static/js/ui.js"></script>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link href="/static/css/output.css" rel="stylesheet" />
    <title>{{.Name}} — Ofan</title>
  </head>
  <body id="screen-wrapper" class="min-h-screen bg-zinc-900 text-neutral-50">
    <div class="flex min-h-screen flex-col md:flex-row">
      {{template "sidebar" .}}
      <div class="flex-1">
        <main class="mx-auto w-full max-w-5xl p-6">
          <div class="mb-4 flex items-center justify-between gap-4">
            <h2 class="text-2xl font-bold text-neutral-50">{{.Name}}</h2>
            <a
              href="/servers"
              class="btn-secondary self-start"
              >Back</a
            >
          </div>
          <div
            id="details-error"
            class="mb-4 text-center text-sm font-medium text-red-500"
          ></div>
          <div
            id="details-status"
            class="mb-4 card p-5"
          >
            <div class="text-sm text-zinc-400">Loading status…</div>
          </div>
          <div
            class="w-full max-w-3xl card p-8 flex flex-col gap-6"
          >
            <h2 class="text-2xl font-bold">Configuration</h2>
            <form id="config-form" class="flex flex-col gap-4" data-server="{{.Name}}">
              <div>
                <label for="password" class="label">Server Password</label>
                <input
                  class="field"
                  type="password"
                  id="password"
                  name="password"
                  minlength="5"
                  required
                />
              </div>
              <details open class="group section-card">
<summary class="flex cursor-pointer list-none items-center justify-between text-lg font-semibold text-neutral-50">Core<span aria-hidden="true" class="text-base text-zinc-400 transition-transform group-open:rotate-180">&#9662;</span></summary>
<div class="mt-4 grid gap-4 md:grid-cols-2">
              <div>
                <label for="world-name" class="label">World Name</label>
                <input
                  class="w-full bg-zinc-800 px-4 py-2 border border-zinc-700 rounded-lg focus:outline-none opacity-50"
                  type="text"
                  id="world-name"
                  disabled
                  title="Frozen after creation — changing it requires recreating the server."
                />
              </div>
              <div>
                <label for="server-port" class="label">Server Port</label>
                <input
                  class="w-full bg-zinc-800 px-4 py-2 border border-zinc-700 rounded-lg focus:outline-none opacity-50"
                  type="number"
                  id="server-port"
                  disabled
                  title="Frozen after creation — changing it requires recreating the server."
                />
              </div>
              <div>
                <label class="flex items-center gap-2 text-sm text-zinc-300" title="Whether the server is listed publicly.">
                  <input type="checkbox" id="server-public" />
                  Public server
                </label>
              </div>
              </div>
</details><details open class="group section-card">
<summary class="flex cursor-pointer list-none items-center justify-between text-lg font-semibold text-neutral-50">Access Control<span aria-hidden="true" class="text-base text-zinc-400 transition-transform group-open:rotate-180">&#9662;</span></summary>
<div class="mt-4 grid gap-4 md:grid-cols-2">
              <div>
                <label for="admin-ids" class="label">Admin IDs</label>
                <input
                  class="field"
                  type="text"
                  id="admin-ids"
                  title="SteamID64 values of admins, comma-separated. Empty means no one."
                />
              </div>
              <div>
                <label for="banned-ids" class="label">Banned IDs</label>
                <input
                  class="field"
                  type="text"
                  id="banned-ids"
                  title="SteamID64 values of banned players, comma-separated. Empty means no one."
                />
              </div>
              <div>
                <label for="permitted-ids" class="label">Permitted IDs</label>
                <input
                  class="field"
                  type="text"
                  id="permitted-ids"
                  title="SteamID64 allowlist. Empty means everyone may join."
                />
              </div>
              </div>
</details><details open class="group section-card">
<summary class="flex cursor-pointer list-none items-center justify-between text-lg font-semibold text-neutral-50">Maintenance<span aria-hidden="true" class="text-base text-zinc-400 transition-transform group-open:rotate-180">&#9662;</span></summary>
<div class="mt-4 grid gap-4 md:grid-cols-2">
              <div>
                <label for="update-cron" class="label">Update Schedule</label>
                <input
                  class="field"
                  type="text"
                  id="update-cron"
                  title="Cron schedule for checking game updates, e.g. every 15 minutes."
                />
              </div>
              <div>
                <label class="flex items-center gap-2 text-sm text-zinc-300" title="Only run scheduled updates when no players are online.">
                  <input type="checkbox" id="update-if-idle" />
                  Update only when idle
                </label>
              </div>
              <div>
                <label for="restart-cron" class="label">Restart Schedule</label>
                <input
                  class="field"
                  type="text"
                  id="restart-cron"
                  title="Cron schedule for scheduled restarts, e.g. daily at 05:10."
                />
              </div>
              <div>
                <label class="flex items-center gap-2 text-sm text-zinc-300" title="Only restart on schedule when no players are online.">
                  <input type="checkbox" id="restart-if-idle" />
                  Restart only when idle
                </label>
              </div>
              <div>
                <label class="flex items-center gap-2 text-sm text-zinc-300" title="Take automatic world backups.">
                  <input type="checkbox" id="backups" />
                  Automatic backups
                </label>
              </div>
              <div>
                <label class="flex items-center gap-2 text-sm text-zinc-300" title="Only take backups when no players are online.">
                  <input type="checkbox" id="backups-if-idle" />
                  Back up only when idle
                </label>
              </div>
              <div>
                <label for="backups-cron" class="label">Backup Schedule</label>
                <input
                  class="field"
                  type="text"
                  id="backups-cron"
                  title="Cron schedule for automatic backups, e.g. hourly at minute 5."
                />
              </div>
              <div>
                <label for="backups-max-age" class="label">Backup Max Age</label>
                <input
                  class="field"
                  type="number"
                  id="backups-max-age"
                  title="Oldest backup age to retain. Older backups are pruned."
                />
              </div>
              <div>
                <label for="backups-max-count" class="label">Backup Max Count</label>
                <input
                  class="field"
                  type="number"
                  id="backups-max-count"
                  title="Maximum number of backups to keep. Oldest are pruned first."
                />
              </div>
              </div>
</details><details open class="group section-card">
<summary class="flex cursor-pointer list-none items-center justify-between text-lg font-semibold text-neutral-50">Mods<span aria-hidden="true" class="text-base text-zinc-400 transition-transform group-open:rotate-180">&#9662;</span></summary>
<div class="mt-4 grid gap-4 md:grid-cols-2">
              <div>
                <label class="flex items-center gap-2 text-sm text-zinc-300" title="ValheimPlus server mod. Mutually exclusive with BepInEx.">
                  <input type="checkbox" id="valheim-plus" />
                  ValheimPlus
                </label>
              </div>
              <div>
                <label class="flex items-center gap-2 text-sm text-zinc-300" title="BepInEx mod framework. Mutually exclusive with ValheimPlus.">
                  <input type="checkbox" id="bepinex" />
                  BepInEx
                </label>
              </div>
              </div>
</details><details open class="group section-card">
<summary class="flex cursor-pointer list-none items-center justify-between text-lg font-semibold text-neutral-50">System<span aria-hidden="true" class="text-base text-zinc-400 transition-transform group-open:rotate-180">&#9662;</span></summary>
<div class="mt-4 grid gap-4 md:grid-cols-2">
              <div>
                <label for="time-zone" class="label">Time Zone</label>
                <input
                  class="field"
                  type="text"
                  id="time-zone"
                  title="IANA time zone used for schedules and logs, e.g. America/Chicago."
                />
              </div>
              <div>
                <label for="puid" class="label">PUID</label>
                <input
                  class="field"
                  type="number"
                  id="puid"
                  title="Linux user ID the server runs as. 0 means root."
                />
              </div>
              <div>
                <label for="pgid" class="label">PGID</label>
                <input
                  class="field"
                  type="number"
                  id="pgid"
                  title="Linux group ID the server runs as. 0 means root."
                />
              </div>
              </div>
</details><div class="sticky bottom-0 md:col-span-2 border-t border-zinc-700 bg-zinc-800/95 py-4 backdrop-blur">
              <div class="flex items-center justify-between gap-3">
                <span id="dirty-note" class="hidden text-sm font-medium text-orange-300">Unsaved changes</span>
                <button id="config-submit" type="submit" class="btn-primary ml-auto">Save Configuration</button>
              </div>
              <div id="config-result" class="mt-2 text-sm font-medium"></div>
            </div>
            </form>
          </div>
        </main>
      </div>
    </div>
    <script>
      var configForm = document.getElementById("config-form");
      var serverName = configForm.getAttribute("data-server");
      function detailsError(text) {
        document.getElementById("details-error").textContent = text;
      }
      function setVal(id, value) {
        var el = document.getElementById(id);
        if (value !== undefined && value !== null) el.value = value;
      }
      function setChecked(id, value) {
        document.getElementById(id).checked = !!value;
      }
      fetch("/api/v1/servers/" + serverName + "/config", {
        headers: { Accept: "application/json" },
      })
        .then(function (resp) {
          if (resp.status === 404) throw new Error("server does not exist");
          if (resp.status === 403)
            throw new Error("only owner or admin may view this server");
          if (!resp.ok) throw new Error("could not load configuration");
          return resp.json();
        })
        .then(function (cfg) {
          setVal("password", cfg.core_settings.server_pass);
          setVal("world-name", cfg.core_settings.world_name);
          setVal("server-port", cfg.core_settings.server_port);
          setChecked("server-public", cfg.core_settings.server_public);
          setVal("admin-ids", cfg.access_control.admin_list_ids);
          setVal("banned-ids", cfg.access_control.banned_list_ids);
          setVal("permitted-ids", cfg.access_control.permitted_list_ids);
          setVal("update-cron", cfg.maintenance.update_cron);
          setChecked("update-if-idle", cfg.maintenance.update_if_idle);
          setVal("restart-cron", cfg.maintenance.restart_cron);
          setChecked("restart-if-idle", cfg.maintenance.restart_if_idle);
          setChecked("backups", cfg.maintenance.backups);
          setChecked("backups-if-idle", cfg.maintenance.backups_if_idle);
          setVal("backups-cron", cfg.maintenance.backups_cron);
          setVal("backups-max-age", cfg.maintenance.backups_max_age);
          setVal("backups-max-count", cfg.maintenance.backups_max_count);
          setVal("time-zone", cfg.system_settings.time_zone);
          setVal("puid", cfg.system_settings.puid);
          setVal("pgid", cfg.system_settings.pgid);
          setChecked("valheim-plus", cfg.mods.valheim_plus);
          setChecked("bepinex", cfg.mods.bepinex);
          baseline = snapshot();
          updateDirty();
        })
        .catch(function (err) {
          detailsError(err.message);
        });
      fetch("/api/v1/servers/" + serverName, {
        headers: { Accept: "application/json" },
      })
        .then(function (resp) {
          if (!resp.ok) throw new Error("could not load status");
          return resp.json();
        })
        .then(function (view) {
          var st = document.getElementById("details-status");
          st.innerHTML = "";
          var rows = [
            ["Status", view.status],
            ["Desired", view.desired_state],
            ["Health", view.health],
            ["Owner", view.owner],
            ["Address", view.node_ip + ":" + view.node_port],
          ];
          rows.forEach(function (pair) {
            var row = document.createElement("div");
            row.className = "text-sm";
            var label = document.createElement("span");
            label.className = "text-zinc-400";
            label.textContent = pair[0] + ": ";
            var val = document.createElement("span");
            val.className = "text-neutral-50";
            val.textContent = pair[1] === undefined || pair[1] === null ? "—" : pair[1];
            row.appendChild(label);
            row.appendChild(val);
            st.appendChild(row);
          });
        })
        .catch(function () {
          document.getElementById("details-status").innerHTML =
            '<div class="text-sm text-zinc-400">Status unavailable</div>';
        });
      var valheimPlusBox = document.getElementById("valheim-plus");
      var bepinexBox = document.getElementById("bepinex");
      valheimPlusBox.addEventListener("change", function () {
        if (valheimPlusBox.checked) bepinexBox.checked = false;
      });
      bepinexBox.addEventListener("change", function () {
        if (bepinexBox.checked) valheimPlusBox.checked = false;
      });
      configForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var result = document.getElementById("config-result");
        ofan.busy(document.getElementById("config-submit"), true);
        function text(id) {
          return document.getElementById(id).value;
        }
        function num(id) {
          return parseInt(document.getElementById(id).value, 10);
        }
        function box(id) {
          return document.getElementById(id).checked;
        }
        var password = document.getElementById("password").value;
        var payload = {
          core_settings: {
            server_name: serverName,
            world_name: text("world-name"),
            server_pass: password,
            server_port: num("server-port"),
            server_public: box("server-public"),
          },
          access_control: {
            admin_list_ids: text("admin-ids"),
            banned_list_ids: text("banned-ids"),
            permitted_list_ids: text("permitted-ids"),
          },
          maintenance: {
            update_cron: text("update-cron"),
            update_if_idle: box("update-if-idle"),
            restart_cron: text("restart-cron"),
            restart_if_idle: box("restart-if-idle"),
            backups: box("backups"),
            backups_if_idle: box("backups-if-idle"),
            backups_cron: text("backups-cron"),
            backups_max_age: num("backups-max-age"),
            backups_max_count: num("backups-max-count"),
          },
          mods: {
            valheim_plus: box("valheim-plus"),
            bepinex: box("bepinex"),
          },
          system_settings: {
            time_zone: text("time-zone"),
            puid: num("puid"),
            pgid: num("pgid"),
          },
        };
        fetch("/api/v1/servers/" + serverName + "/config", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify(payload),
        }).then(function (resp) {
          ofan.busy(document.getElementById("config-submit"), false);
          if (resp.status !== 200) {
            resp.text().then(function (t) {
              result.textContent = t;
              result.classList.add("text-red-500");
              result.classList.remove("text-emerald-400");
            });
            return;
          }
          result.textContent = "Configuration saved — applying shortly.";
          baseline = snapshot();
          updateDirty();
          ofan.toast("Configuration saved", true);
          result.classList.remove("text-red-500");
          result.classList.add("text-emerald-400");
        });
      });
          var baseline = "";
      function snapshot() {
        return Array.prototype.map
          .call(configForm.elements, function (el) {
            return el.type === "checkbox" ? String(el.checked) : el.value;
          })
          .join("\u0001");
      }
      function updateDirty() {
        document.getElementById("dirty-note").classList.toggle("hidden", snapshot() === baseline);
      }
      configForm.addEventListener("input", updateDirty);
      configForm.addEventListener("change", updateDirty);
</script>
  </body>
</html>
{{end}}
