{{define "view"}}{{range $name, $view := .}}
<div class="server-card rounded-xl border border-zinc-700 bg-zinc-800 p-5 shadow">
  <div class="flex items-center justify-between gap-3">
    <div class="text-lg font-semibold text-neutral-50">{{$name}}</div>
    <div class="relative flex items-center gap-1">
      <div
        class="rounded-full px-3 py-1 text-xs font-semibold bg-zinc-700 text-zinc-200"
      >
        {{$view.Health}}
      </div>
      <button
        type="button"
        class="kebab-toggle p-2 rounded-full hover:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-amber-500"
      >
        ⋮
      </button>
      <div
        class="card-menu hidden absolute right-0 top-full z-10 rounded-xl border border-zinc-700 bg-zinc-800 p-2 shadow"
      >
        <button
          type="button"
          class="menu-delete rounded-lg px-4 py-2 text-sm hover:bg-zinc-700"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
  <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
    <div class="flex flex-col gap-1">
      <span class="text-zinc-400">Status</span>
      <div class="text-neutral-50">{{$view.Status}}</div>
    </div>
    <div class="flex flex-col gap-1">
      <span class="text-zinc-400">Desired State</span>
      <div class="text-neutral-50">{{$view.DesiredState}}</div>
    </div>
    <div class="flex flex-col gap-1">
      <span class="text-zinc-400">Owner</span>
      <div class="text-neutral-50">{{$view.Owner}}</div>
    </div>
    <div class="text-sm col-span-2 text-zinc-400">
      {{$view.NodeIP}}:{{$view.NodePort}}
    </div>
  </div>
  <form
    class="confirm-row hidden mt-3 border-t border-zinc-700 pt-3"
    hx-post="/api/v1/servers/{{$name}}/delete"
    hx-ext="json-enc"
    hx-swap="none"
  >
    <label class="flex items-center gap-2 text-sm text-zinc-400">
      <input type="checkbox" name="delete_storage" value="true" />
      Delete saved world too
    </label>
    <div class="mt-2 flex gap-2">
      <button
        type="submit"
        class="confirm-yes rounded-lg bg-red-700 px-4 py-2 text-sm font-medium transition-colors hover:bg-red-600"
      >
        Delete
      </button>
      <button
        type="button"
        class="confirm-no rounded-lg bg-zinc-700 px-4 py-2 text-sm font-medium transition-colors hover:bg-zinc-600"
      >
        Cancel
      </button>
    </div>
    <div class="card-error mt-2 text-sm font-medium text-red-500"></div>
  </form>
</div>
{{else}}
<div
  class="rounded-xl border border-dashed border-zinc-700 p-8 text-center text-sm text-zinc-400"
>
  No servers to display
</div>
{{end}} {{end}}
