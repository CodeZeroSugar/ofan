{{define "view"}}{{range $name, $view := .}}
<div class="server-card rounded-xl border border-zinc-700 bg-zinc-800 p-5 shadow" data-server="{{$name}}">
  <div class="flex items-center justify-between gap-3">
    <div class="text-lg font-semibold text-neutral-50"><a href="/servers/{{$name}}" class="hover:text-amber-500 transition-colors">{{$name}}</a></div>
    <div class="flex items-center gap-1">
      <div
        class="rounded-full px-3 py-1 text-xs font-semibold {{if eq $view.Health "healthy"}}bg-emerald-800 text-emerald-100{{else if eq $view.Health "degraded"}}bg-amber-800 text-amber-100{{else if eq $view.Health "failed"}}bg-red-800 text-red-100{{else}}bg-zinc-700 text-zinc-200{{end}}"
      >
        {{$view.Health}}
      </div>
      <button
        type="button"
        aria-label="Server options"
        class="kebab-toggle p-2 rounded-full hover:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-amber-500"
        data-server="{{$name}}"
        data-status="{{$view.Status}}"
      >
        ⋮
      </button>
    </div>
  </div>
  <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
    <div class="flex flex-col gap-1">
      <span class="text-zinc-400">Status</span>
      <div class="text-neutral-50">{{$view.Status}}</div>
    </div>
    <div class="flex flex-col gap-1">
      <span class="text-zinc-400">Desired State</span>
      <div class="text-neutral-50">{{$view.DesiredState}}</div>
    </div>
    <div class="flex flex-col gap-1">
      <span class="text-zinc-400">Owner</span>
      <div class="text-neutral-50">{{$view.Owner}}</div>
    </div>
    <div class="text-sm col-span-2 text-zinc-400">
      {{$view.NodeIP}}:{{$view.NodePort}}
    </div>
  </div>
</div>
{{else}}
<div
  class="rounded-xl border border-dashed border-zinc-700 p-8 text-center text-sm text-zinc-400"
>
  No servers to display
</div>
{{end}} {{end}}
