{{define "login"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/static/htmx.min.js"></script>
  <script src="/static/json-enc.js"></script>
  <link href="/static/css/output.css" rel="stylesheet" />
</head>
<body>
<div
  id="screen-wrapper"
  class="flex flex-col min-h-screen items-center bg-zinc-900 text-neutral-50"
>
  <div id="title-wrapper" class="flex flex-1 items-center justify-center pb-8">
    <h1
      class="text-4xl md:text-5xl font-extrabold text-amber-500 tracking-tight"
    >
      Ofan
    </h1>
  </div>
  <div
    id="login-container"
    class="w-full max-w-md bg-zinc-700 rounded-2xl shadow-xl p-8 flex flex-col gap-6"
  >
    <h2 class="text-2xl font-bold">Login</h2>
    <form
      id="login-form"
      class="flex flex-col gap-4"
      hx-post="/api/v1/auth/login"
      hx-ext="json-enc"
      hx-swap="none"
    >
      <div>
        <label for="username" class="mb-1 block text-sm font-medium text-zinc-400">Username</label>
        <input
          class="w-full bg-zinc-800 px-4 py-2 border border-amber-500 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
          type="text"
          id="username"
          name="username"
          required
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-zinc-400">Password</label>
        <input
          class="w-full bg-zinc-800 px-4 py-2 border border-amber-500 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
          type="password"
          id="password"
          name="password"
          required
        />
      </div>
      <button
        type="submit"
        class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-900 font-medium py-2 rounded-lg transition-colors"
      >
        Submit
      </button>
    </form>
    <form
      id="change-password-form"
      class="flex flex-col gap-4"
      style="display: none"
      hx-post="/api/v1/auth/password"
      hx-ext="json-enc"
      hx-swap="none"
    >
      <div>
        <label for="new-password" class="mb-1 block text-sm font-medium text-zinc-400">New Password</label>
        <input
          class="w-full bg-zinc-800 px-4 py-2 border border-amber-500 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
          type="password"
          id="new-password"
          name="new_password"
          required
        />
      </div>
      <button
        class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-900 font-medium py-2 rounded-lg transition-colors"
        type="submit"
      >
        Submit
      </button>
    </form>
    <div
      id="login-error"
      class="min-h-5 text-center text-sm font-medium text-red-500"
    ></div>
    <script>
      document.body.addEventListener("htmx:afterRequest", function (event) {
        const reqElement = event.detail.elt;
        if (!reqElement) return;
        const responseStatus = event.detail.xhr.status;
        if (reqElement.id === "login-form") {
          if (responseStatus !== 200) {
            document.getElementById("login-error").textContent =
              event.detail.xhr.responseText;
            return;
          }
          let data = {};
          try {
            data = JSON.parse(event.detail.xhr.responseText);
          } catch (error) {
            document.getElementById("login-error").textContent =
              event.detail.xhr.responseText;
            return;
          }
          if (data.must_change_password) {
            document.getElementById("login-form").style.display = "none";
            document.getElementById("change-password-form").style.display =
              "flex";
            return;
          }
          window.location.href = "/servers";
        } else if (reqElement.id === "change-password-form") {
          if (responseStatus !== 200) {
            document.getElementById("login-error").textContent =
              event.detail.xhr.responseText;
            return;
          }
          window.location.href = "/servers";
        } else {
          return;
        }
      });
    </script>
  </div>
  <div class="flex-1"></div>
</div>
</body>
</html>
{{end}}
