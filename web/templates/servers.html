{{define "servers"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/htmx.min.js"></script>
    <script src="/static/json-enc.js"></script>
    <link href="/static/css/output.css" rel="stylesheet" />
    <title>{{ .Title }}</title>
  </head>
  <body id="screen-wrapper" class="min-h-screen bg-zinc-900 text-neutral-50">
    <div class="flex min-h-screen flex-col md:flex-row">
      <aside
        class="flex w-full flex-row flex-wrap items-center gap-2 border-b border-zinc-800 p-4 md:min-h-screen md:w-56 md:flex-col md:items-stretch md:gap-1 md:border-b-0 md:border-r md:p-6"
      >
        <div
          class="mb-0 mr-auto text-xl font-extrabold text-amber-500 md:mb-4 md:mr-0 md:text-2xl"
        >
          Ofan
        </div>
        <a
          href="/servers"
          class="rounded-lg bg-zinc-800 px-3 py-2 text-sm font-medium text-amber-500"
          >Servers</a
        >
        {{if .IsAdmin}}
        <a
          href="/admin"
          class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-zinc-800 hover:text-neutral-50"
          >Admin</a
        >
        {{end}}
        <a
          href="/settings"
          class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-zinc-800 hover:text-neutral-50"
          >Settings</a
        >
        <div
          class="ml-auto flex items-center gap-2 md:ml-0 md:mt-auto md:flex-col md:items-stretch"
        >
          <div class="hidden text-sm text-zinc-400 md:block">
            logged in as {{ .Username }}
          </div>
          <button
            id="logout-button"
            class="rounded-lg border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-300 transition-colors hover:bg-zinc-700"
            hx-post="/api/v1/auth/logout"
            hx-swap="none"
          >
            Log Out
          </button>
          <div
            id="logout-error"
            class="mt-2 text-right text-sm font-medium text-red-500"
          ></div>
        </div>
        <script>
          document.body.addEventListener("htmx:afterRequest", function (event) {
            const reqElement = event.detail.elt;
            if (!reqElement) return;
            const responseStatus = event.detail.xhr.status;
            if (reqElement.id === "logout-button") {
              if (responseStatus !== 200) {
                window.location.href = "/login";
                return;
              }
              let data = {};
              try {
                data = JSON.parse(event.detail.xhr.responseText);
              } catch (error) {
                window.location.href = "/login";
                return;
              }
              if (data.message === "logout successful") {
                window.location.href = "/login";
              }
            }
          });
        </script>
        <script>
          document.body.addEventListener("click", function (event) {
            function hideMenu() {
              document.getElementById("card-menu").classList.add("hidden");
            }
            var toggle = event.target.closest(".kebab-toggle");
            if (toggle) {
              var menu = document.getElementById("card-menu");
              var wasHidden = menu.classList.contains("hidden");
              hideMenu();
              if (!wasHidden) return;
              var serverName = toggle.getAttribute("data-server");
              var status = toggle.getAttribute("data-status");
              menu.querySelector(".menu-delete").setAttribute("data-server", serverName);
              menu.querySelector(".menu-transfer").setAttribute("data-server", serverName);
              menu.querySelector(".menu-edit").setAttribute("href", "/servers/" + serverName);
              menu.querySelector(".menu-start").setAttribute("data-server", serverName);
              menu.querySelector(".menu-stop").setAttribute("data-server", serverName);
              menu.querySelector(".menu-start").classList.toggle("hidden", status !== "stopped");
              menu.querySelector(".menu-stop").classList.toggle("hidden", status !== "running");
              var rect = toggle.getBoundingClientRect();
              menu.classList.remove("hidden");
              var menuWidth = menu.offsetWidth;
              menu.style.left = Math.max(8, Math.min(rect.right - menuWidth, window.innerWidth - menuWidth - 8)) + "px";
              menu.style.top = rect.bottom + 4 + "px";
              return;
            }
            if (event.target.closest("#card-menu") === null) hideMenu();
            var del = event.target.closest(".menu-delete");
            if (del) {
              var serverName = del.getAttribute("data-server");
              var bar = document.getElementById("delete-confirm");
              var form = document.getElementById("delete-confirm-form");
              document
                .getElementById("delete-confirm-name")
                .textContent = serverName;
              document.getElementById("delete-confirm-error").textContent = "";
              form.setAttribute("data-server", serverName);
              form.setAttribute(
                "hx-post",
                "/api/v1/servers/" + serverName + "/delete",
              );
              document.getElementById("card-menu").classList.add("hidden");
              bar.classList.remove("hidden");
              return;
            }
            var cancel = event.target.closest(".confirm-no");
            if (cancel) {
              document.getElementById("delete-confirm").classList.add("hidden");
              document.getElementById("delete-confirm-error").textContent = "";
              document.getElementById("transfer-bar").classList.add("hidden");
              document.getElementById("transfer-error").textContent = "";
              return;
            }
            var xfer = event.target.closest(".menu-transfer");            if (xfer) {
              var xferName = xfer.getAttribute("data-server");
              document.getElementById("transfer-name").textContent = xferName;
              document.getElementById("transfer-error").textContent = "";
              var xferForm = document.getElementById("transfer-form");
              xferForm.setAttribute("data-server", xferName);
              xferForm.reset();
              document.getElementById("card-menu").classList.add("hidden");
              document.getElementById("transfer-bar").classList.remove("hidden");
              return;
            }
            var power = event.target.closest(".menu-start, .menu-stop");
            if (power) {
              var powerName = power.getAttribute("data-server");
              var action = power.classList.contains("menu-start") ? "start" : "stop";
              document.getElementById("card-menu").classList.add("hidden");
              fetch("/api/v1/servers/" + powerName + "/" + action, {
                method: "POST",
                headers: { Accept: "application/json" },
              }).then(function (resp) {
                var actionError = document.getElementById("action-error");
                var actionCard = document.querySelector(
                  '.server-card[data-server="' + powerName + '"]',
                );
                if (resp.status !== 200) {
                  resp.text().then(function (text) {
                    actionError.textContent = text;
                  });
                  return;
                }
                actionError.textContent = "";
                if (actionCard) actionCard.classList.add("opacity-50");
              });
              return;
            }
          });
          document.body.addEventListener(
            "htmx:configRequest",
            function (event) {
              var reqElement = event.detail.elt;
              if (
                !reqElement ||
                reqElement.id !== "delete-confirm-form" ||
                !reqElement.getAttribute("data-server")
              )
                return;
              event.detail.path =
                "/api/v1/servers/" +
                reqElement.getAttribute("data-server") +
                "/delete";
            },
          );
          document.body.addEventListener("htmx:afterRequest", function (event) {
            var reqElement = event.detail.elt;
            if (!reqElement || reqElement.id !== "delete-confirm-form") return;var serverName = reqElement.getAttribute("data-server") || "";
            var card = serverName
              ? document.querySelector(
                  '.server-card[data-server="' + serverName + '"]',
                )
              : null;
            if (event.detail.xhr.status !== 202) {
              document.getElementById("delete-confirm-error").textContent =
                event.detail.xhr.responseText;
              return;
            }
            document.getElementById("delete-confirm").classList.add("hidden");
            if (card) card.classList.add("opacity-50");
          });
          window.addEventListener("scroll", function () {
            document.getElementById("card-menu").classList.add("hidden");
          }, true);
          window.addEventListener("resize", function () {
            document.getElementById("card-menu").classList.add("hidden");
          });
          document.body.addEventListener("htmx:afterSwap", function (event) {
            if (event.target && event.target.id === "server-list")
              document.getElementById("card-menu").classList.add("hidden");
          });
        </script>
        <script>
          document.body.addEventListener("submit", function (event) {
            var form = event.target;
            if (!form || form.id !== "transfer-form") return;
            event.preventDefault();
            var serverName = form.getAttribute("data-server") || "";
            var newOwner = document
              .getElementById("transfer-new-owner")
              .value.trim();
            if (!serverName || !newOwner) return;
            fetch("/api/v1/servers/" + serverName + "/transfer", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ new_owner: newOwner }),
            }).then(function (resp) {
              if (resp.status !== 200) {
                resp.text().then(function (text) {
                  document.getElementById("transfer-error").textContent =
                    text;
                });
                return;
              }
              document.getElementById("transfer-bar").classList.add("hidden");
              var card = document.querySelector(
                '.server-card[data-server="' + serverName + '"]',
              );
              if (card) card.classList.add("opacity-50");
            });
          });
        </script>
      </aside>
      <div class="flex-1">
        <main class="mx-auto w-full max-w-5xl p-6">
          <div class="mb-4 flex items-center justify-between gap-4">
            <h2 class="text-2xl font-bold text-amber-500">{{ .Title }}</h2>
            <a
              href="/servers/new"
              class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-medium text-zinc-900 transition-colors hover:bg-amber-400 inline-block"
              >Create</a
            >
          </div>
          <div
            id="action-error"
            class="mb-4 text-center text-sm font-medium text-red-500"
          ></div>
          <div
            id="delete-confirm"
            class="hidden mb-4 rounded-xl border border-zinc-700 bg-zinc-800 p-5 shadow"
          >
            <div class="text-sm text-zinc-400">
              Delete server
              <span id="delete-confirm-name" class="font-semibold text-neutral-50"></span>?
            </div>
            <form
              id="delete-confirm-form"
              class="mt-3"
              hx-post="/api/v1/servers/delete"
              hx-ext="json-enc"
              hx-swap="none"
            >
              <label class="flex items-center gap-2 text-sm text-zinc-400">
                <input type="checkbox" name="delete_storage" value="true" />
                Delete saved world too
              </label>
              <div class="mt-2 flex gap-2">
                <button
                  type="submit"
                  class="rounded-lg bg-red-700 px-4 py-2 text-sm font-medium transition-colors hover:bg-red-600"
                >
                  Delete
                </button>
                <button
                  type="button"
                  class="confirm-no rounded-lg bg-zinc-700 px-4 py-2 text-sm font-medium transition-colors hover:bg-zinc-600"
                >
                  Cancel
                </button>
              </div>
              <div
                id="delete-confirm-error"
                class="mt-2 text-sm font-medium text-red-500"
              ></div>
            </form>
          </div>
          <div
            id="transfer-bar"
            class="hidden mb-4 rounded-xl border border-zinc-700 bg-zinc-800 p-5 shadow"
          >
            <div class="text-sm text-zinc-400">
              Transfer server
              <span id="transfer-name" class="font-semibold text-neutral-50"></span>
              to a new owner. Transferring away removes it from your list.
            </div>
            <form id="transfer-form" class="mt-3 flex flex-col gap-4">
              <div>
                <label
                  for="transfer-new-owner"
                  class="mb-1 block text-sm font-medium text-zinc-400"
                  >New Owner Username</label
                >
                <input
                  class="w-full bg-zinc-800 px-4 py-2 border border-amber-500 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
                  type="text"
                  id="transfer-new-owner"
                  required
                />
              </div>
              <div class="flex gap-2">
                <button
                  type="submit"
                  class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-medium text-zinc-900 transition-colors hover:bg-amber-400"
                >
                  Transfer
                </button>
                <button
                  type="button"
                  class="confirm-no rounded-lg bg-zinc-700 px-4 py-2 text-sm font-medium transition-colors hover:bg-zinc-600"
                >
                  Cancel
                </button>
              </div>
              <div
                id="transfer-error"
                class="text-sm font-medium text-red-500"
              ></div>
            </form>
          </div>
          <div
            id="card-menu"
            class="hidden fixed z-50 flex flex-col rounded-xl border border-zinc-700 bg-zinc-800 p-2 shadow"
          >
            <button
              type="button"
              class="menu-delete rounded-lg px-4 py-2 text-left text-sm hover:bg-zinc-700"
            >
              Delete
            </button>
            <button
              type="button"
              class="menu-transfer rounded-lg px-4 py-2 text-left text-sm hover:bg-zinc-700"
            >
              Transfer
            </button>
            <a
              id="menu-edit"
              href="/servers"
              class="menu-edit rounded-lg px-4 py-2 text-left text-sm hover:bg-zinc-700"
            >
              Edit
            </a>
            <button
              type="button"
              class="menu-start rounded-lg px-4 py-2 text-left text-sm hover:bg-zinc-700"
            >
              Start
            </button>
            <button
              type="button"
              class="menu-stop rounded-lg px-4 py-2 text-left text-sm hover:bg-zinc-700"
            >
              Stop
            </button>
          </div>
          <div
            id="server-list"
            class="flex flex-col gap-4"
            hx-get="/api/v1/servers"
            hx-trigger="every 5s"
            hx-headers='{"Accept": "text/html"}'
          >
            {{ template "view" .Servers}}
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
{{end}}
