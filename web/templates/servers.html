{{define "servers"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/htmx.min.js"></script>
    <script src="/static/json-enc.js"></script>
    <script src="/static/js/ui.js"></script>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link href="/static/css/output.css" rel="stylesheet" />
    <title>{{ .Title }}</title>
  </head>
  <body id="screen-wrapper" class="min-h-screen bg-zinc-900 text-neutral-50">
    <div class="flex min-h-screen flex-col md:flex-row">
      {{template "sidebar" .}}
      <div class="flex-1">
        <main class="mx-auto w-full max-w-5xl p-6">
          <div class="mb-4 flex items-center justify-between gap-4">
            <h2 class="text-2xl font-bold text-neutral-50">{{ .Title }}</h2>
            <a
              href="/servers/new"
              class="btn-primary"
              >Create</a
            >
          </div>
          <div
            id="action-error"
            class="mb-4 text-center text-sm font-medium text-red-500"
          ></div>
          <div
            id="delete-confirm"
            class="hidden mb-4 card p-5"
          >
            <div class="text-sm text-zinc-400">
              Delete server
              <span id="delete-confirm-name" class="font-semibold text-neutral-50"></span>?
            </div>
            <form
              id="delete-confirm-form"
              class="mt-3"
              hx-post="/api/v1/servers/delete"
              hx-ext="json-enc"
              hx-swap="none"
            >
              <label class="flex items-center gap-2 text-sm text-zinc-400">
                <input type="checkbox" name="delete_storage" value="true" />
                Delete saved world too
              </label>
              <div class="mt-2 flex gap-2">
                <button
                  type="submit"
                  class="btn-danger"
                >
                  Delete
                </button>
                <button
                  type="button"
                  class="confirm-no btn-secondary"
                >
                  Cancel
                </button>
              </div>
              <div
                id="delete-confirm-error"
                class="mt-2 text-sm font-medium text-red-500"
              ></div>
            </form>
          </div>
          <div
            id="transfer-bar"
            class="hidden mb-4 card p-5"
          >
            <div class="text-sm text-zinc-400">
              Transfer server
              <span id="transfer-name" class="font-semibold text-neutral-50"></span>
              to a new owner. Transferring away removes it from your list.
            </div>
            <form id="transfer-form" class="mt-3 flex flex-col gap-4">
              <div>
                <label
                  for="transfer-new-owner"
                  class="label"
                  >New Owner Username</label
                >
                <input
                  class="field"
                  type="text"
                  id="transfer-new-owner"
                  required
                />
              </div>
              <div class="flex gap-2">
                <button
                  type="submit"
                  class="btn-primary"
                >
                  Transfer
                </button>
                <button
                  type="button"
                  class="confirm-no btn-secondary"
                >
                  Cancel
                </button>
              </div>
              <div
                id="transfer-error"
                class="text-sm font-medium text-red-500"
              ></div>
            </form>
          </div>
          <div
            id="card-menu"
            class="hidden fixed z-50 flex flex-col rounded-xl border border-zinc-700 bg-zinc-800 p-2 shadow"
          >
            <button
              type="button"
              class="menu-delete menu-item"
            >
              Delete
            </button>
            <button
              type="button"
              class="menu-transfer menu-item"
            >
              Transfer
            </button>
            <a
              id="menu-edit"
              href="/servers"
              class="menu-edit menu-item"
            >
              Edit
            </a>
            <button
              type="button"
              class="menu-start menu-item"
            >
              Start
            </button>
            <button
              type="button"
              class="menu-stop menu-item"
            >
              Stop
            </button>
          </div>
          <div
            id="server-list"
            class="flex flex-col gap-4"
            hx-get="/api/v1/servers"
            hx-trigger="every 5s"
            hx-headers='{"Accept": "text/html"}'
          >
            {{ template "view" .Servers}}
          </div>
        </main>
      </div>
    </div>
  <script>
    (function () {
      var PENDING_MS = 60000;
      var pending = {};
      var menu = document.getElementById("card-menu");

      function hideMenu() {
        menu.classList.add("hidden");
        document.querySelectorAll(".kebab-toggle").forEach(function (b) {
          b.setAttribute("aria-expanded", "false");
        });
      }

      function openMenu(toggle) {
        var name = toggle.getAttribute("data-server");
        var status = toggle.getAttribute("data-status");
        menu.querySelector(".menu-delete").setAttribute("data-server", name);
        menu.querySelector(".menu-transfer").setAttribute("data-server", name);
        menu.querySelector(".menu-edit").setAttribute("href", "/servers/" + name);
        menu.querySelector(".menu-start").setAttribute("data-server", name);
        menu.querySelector(".menu-stop").setAttribute("data-server", name);
        menu.querySelector(".menu-start").classList.toggle("hidden", status !== "stopped");
        menu.querySelector(".menu-stop").classList.toggle("hidden", status !== "running");
        var rect = toggle.getBoundingClientRect();
        menu.classList.remove("hidden");
        var width = menu.offsetWidth;
        menu.style.left = Math.max(8, Math.min(rect.right - width, window.innerWidth - width - 8)) + "px";
        menu.style.top = rect.bottom + 4 + "px";
        toggle.setAttribute("aria-expanded", "true");
        var first = Array.prototype.find.call(menu.querySelectorAll("button, a"), function (el) {
          return !el.classList.contains("hidden");
        });
        if (first) first.focus();
      }

      // Pending labels survive poll re-renders: applied after every list settle
      // until the status reaches the expected value, the card disappears, or time runs out.
      function setPending(name, label, expect, ms) {
        pending[name] = { label: label, expect: expect, until: Date.now() + (ms || PENDING_MS) };
        applyPending();
      }

      function applyPending() {
        Object.keys(pending).forEach(function (name) {
          var entry = pending[name];
          var card = document.querySelector('.server-card[data-server="' + name + '"]');
          if (
            !card ||
            Date.now() > entry.until ||
            (entry.expect && card.getAttribute("data-status") === entry.expect)
          ) {
            delete pending[name];
            return;
          }
          var pill = card.querySelector("[data-status-pill]");
          if (pill) pill.textContent = entry.label;
        });
      }

      document.body.addEventListener("htmx:afterSettle", function (event) {
        if (event.target && event.target.id === "server-list") applyPending();
      });
      document.body.addEventListener("htmx:afterSwap", function (event) {
        if (event.target && event.target.id === "server-list") hideMenu();
      });

      document.body.addEventListener("click", function (event) {
        var toggle = event.target.closest(".kebab-toggle");
        if (toggle) {
          var wasHidden = menu.classList.contains("hidden");
          hideMenu();
          if (wasHidden) openMenu(toggle);
          return;
        }
        if (event.target.closest("#card-menu") === null) hideMenu();

        var del = event.target.closest(".menu-delete");
        if (del) {
          hideMenu();
          var name = del.getAttribute("data-server");
          var form = document.getElementById("delete-confirm-form");
          document.getElementById("delete-confirm-name").textContent = name;
          document.getElementById("delete-confirm-error").textContent = "";
          form.setAttribute("data-server", name);
          form.setAttribute("hx-post", "/api/v1/servers/" + name + "/delete");
          document.getElementById("delete-confirm").classList.remove("hidden");
          return;
        }

        var cancel = event.target.closest(".confirm-no");
        if (cancel) {
          document.getElementById("delete-confirm").classList.add("hidden");
          document.getElementById("delete-confirm-error").textContent = "";
          document.getElementById("transfer-bar").classList.add("hidden");
          document.getElementById("transfer-error").textContent = "";
          return;
        }

        var xfer = event.target.closest(".menu-transfer");
        if (xfer) {
          hideMenu();
          var xferName = xfer.getAttribute("data-server");
          document.getElementById("transfer-name").textContent = xferName;
          document.getElementById("transfer-error").textContent = "";
          var xferForm = document.getElementById("transfer-form");
          xferForm.setAttribute("data-server", xferName);
          xferForm.reset();
          document.getElementById("transfer-bar").classList.remove("hidden");
          document.getElementById("transfer-new-owner").focus();
          return;
        }

        var power = event.target.closest(".menu-start, .menu-stop");
        if (power) {
          hideMenu();
          var powerName = power.getAttribute("data-server");
          var action = power.classList.contains("menu-start") ? "start" : "stop";
          var actionError = document.getElementById("action-error");
          fetch("/api/v1/servers/" + powerName + "/" + action, {
            method: "POST",
            headers: { Accept: "application/json" },
          })
            .then(function (resp) {
              if (resp.status !== 200) {
                resp.text().then(function (text) {
                  actionError.textContent = text;
                });
                return;
              }
              actionError.textContent = "";
              setPending(
                powerName,
                action === "start" ? "Starting…" : "Stopping…",
                action === "start" ? "running" : "stopped",
              );
            })
            .catch(function () {
              actionError.textContent = "Could not reach the server.";
            });
          return;
        }
      });

      document.body.addEventListener("htmx:configRequest", function (event) {
        var req = event.detail.elt;
        if (!req || req.id !== "delete-confirm-form" || !req.getAttribute("data-server")) return;
        event.detail.path = "/api/v1/servers/" + req.getAttribute("data-server") + "/delete";
      });

      document.body.addEventListener("htmx:beforeRequest", function (event) {
        var req = event.detail.elt;
        if (req && req.id === "delete-confirm-form") {
          ofan.busy(req.querySelector('button[type="submit"]'), true);
        }
      });

      document.body.addEventListener("htmx:afterRequest", function (event) {
        var req = event.detail.elt;
        if (!req || req.id !== "delete-confirm-form") return;
        ofan.busy(req.querySelector('button[type="submit"]'), false);
        var name = req.getAttribute("data-server") || "";
        if (event.detail.xhr.status !== 202) {
          document.getElementById("delete-confirm-error").textContent = event.detail.xhr.responseText;
          return;
        }
        document.getElementById("delete-confirm").classList.add("hidden");
        setPending(name, "Deleting…", "deleting");
      });

      document.body.addEventListener("submit", function (event) {
        var form = event.target;
        if (!form || form.id !== "transfer-form") return;
        event.preventDefault();
        var serverName = form.getAttribute("data-server") || "";
        var newOwner = document.getElementById("transfer-new-owner").value.trim();
        var errorEl = document.getElementById("transfer-error");
        var submit = form.querySelector('button[type="submit"]');
        if (!serverName || !newOwner) return;
        ofan.busy(submit, true);
        errorEl.textContent = "";
        fetch("/api/v1/servers/" + serverName + "/transfer", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify({ new_owner: newOwner }),
        })
          .then(function (resp) {
            ofan.busy(submit, false);
            if (resp.status !== 200) {
              resp.text().then(function (text) {
                errorEl.textContent = text;
              });
              return;
            }
            document.getElementById("transfer-bar").classList.add("hidden");
            ofan.toast("Ownership of " + serverName + " moved to " + newOwner, true);
            setPending(serverName, "Transferring…", null, 8000);
          })
          .catch(function () {
            ofan.busy(submit, false);
            errorEl.textContent = "Could not reach the server.";
          });
      });

      window.addEventListener("scroll", hideMenu, true);
      window.addEventListener("resize", hideMenu);
      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape" || menu.classList.contains("hidden")) return;
        var opener = document.querySelector('.kebab-toggle[aria-expanded="true"]');
        hideMenu();
        if (opener) opener.focus();
      });
    })();
  </script>
  </body>
</html>
{{end}}
