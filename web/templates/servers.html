{{define "servers"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/htmx.min.js"></script>
    <script src="/static/json-enc.js"></script>
    <link href="/static/css/output.css" rel="stylesheet" />
    <title>{{ .Title }}</title>
  </head>
  <body id="screen-wrapper" class="min-h-screen bg-zinc-900 text-neutral-50">
    <header
      class="mx-auto flex w-full max-w-5xl flex-wrap items-center justify-between gap-4 p-6"
    >
      <h2 class="text-2xl font-bold text-amber-500">{{ .Title }}</h2>
      <div class="text-sm text-zinc-400">logged in as {{ .Username }}</div>
      <div>
        <button
          id="logout-button"
          class="rounded-lg border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-300 transition-colors hover:bg-zinc-700"
          hx-post="/api/v1/auth/logout"
          hx-swap="none"
        >
          Log Out
        </button>
        <a
          href="/servers/new"
          class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-medium text-zinc-900 transition-colors hover:bg-amber-400 inline-block"
          >Create</a
        >
        <script>
          document.body.addEventListener("htmx:afterRequest", function (event) {
            const reqElement = event.detail.elt;
            if (!reqElement) return;
            const responseStatus = event.detail.xhr.status;
            if (reqElement.id === "logout-button") {
              if (responseStatus !== 200) {
                window.location.href = "/login";
                return;
              }
              let data = {};
              try {
                data = JSON.parse(event.detail.xhr.responseText);
              } catch (error) {
                window.location.href = "/login";
                return;
              }
              if (data.message === "logout successful") {
                window.location.href = "/login";
              }
            }
          });
        </script>
        <script>
          document.body.addEventListener("click", function (event) {
            var toggle = event.target.closest(".kebab-toggle");
            if (toggle) {
              var card = toggle.closest(".server-card");
              var menu = card.querySelector(".card-menu");
              var willShow = menu.classList.contains("hidden");
              document.querySelectorAll(".card-menu").forEach(function (m) {
                m.classList.add("hidden");
              });
              if (willShow) menu.classList.remove("hidden");
              return;
            }
            var del = event.target.closest(".menu-delete");
            if (del) {
              var serverName = del.getAttribute("data-server");
              var bar = document.getElementById("delete-confirm");
              var form = document.getElementById("delete-confirm-form");
              document
                .getElementById("delete-confirm-name")
                .textContent = serverName;
              document.getElementById("delete-confirm-error").textContent = "";
              form.setAttribute("data-server", serverName);
              form.setAttribute(
                "hx-post",
                "/api/v1/servers/" + serverName + "/delete",
              );
              del.closest(".server-card").querySelector(".card-menu").classList.add("hidden");
              bar.classList.remove("hidden");
              return;
            }
            var cancel = event.target.closest(".confirm-no");
            if (cancel) {
              document.getElementById("delete-confirm").classList.add("hidden");
              document.getElementById("delete-confirm-error").textContent = "";
              return;
            }
          });
          document.body.addEventListener(
            "htmx:configRequest",
            function (event) {
              var reqElement = event.detail.elt;
              if (
                !reqElement ||
                reqElement.id !== "delete-confirm-form" ||
                !reqElement.getAttribute("data-server")
              )
                return;
              event.detail.path =
                "/api/v1/servers/" +
                reqElement.getAttribute("data-server") +
                "/delete";
            },
          );
          document.body.addEventListener("htmx:afterRequest", function (event) {
            var reqElement = event.detail.elt;
            if (!reqElement || reqElement.id !== "delete-confirm-form") return;var serverName = reqElement.getAttribute("data-server") || "";
            var card = serverName
              ? document.querySelector(
                  '.server-card[data-server="' + serverName + '"]',
                )
              : null;
            if (event.detail.xhr.status !== 202) {
              document.getElementById("delete-confirm-error").textContent =
                event.detail.xhr.responseText;
              return;
            }
            document.getElementById("delete-confirm").classList.add("hidden");
            if (card) card.classList.add("opacity-50");
          });
          document.body.addEventListener("htmx:afterRequest", function (event) {
            var reqElement = event.detail.elt;
            if (
              !reqElement ||
              !reqElement.classList ||
              (!reqElement.classList.contains("menu-start") &&
                !reqElement.classList.contains("menu-stop"))
            )
              return;
            var actionError = document.getElementById("action-error");
            var actionCard = reqElement.closest(".server-card");
            if (event.detail.xhr.status !== 200) {
              actionError.textContent = event.detail.xhr.responseText;
              return;
            }
            actionError.textContent = "";
            if (actionCard) actionCard.classList.add("opacity-50");
          });
        </script>
        <div
          id="logout-error"
          class="mt-2 text-right text-sm font-medium text-red-500"
        ></div>
      </div>
    </header>
    <main class="mx-auto w-full max-w-5xl p-6">
      <div
        id="action-error"
        class="mb-4 text-center text-sm font-medium text-red-500"
      ></div>
      <div
        id="delete-confirm"
        class="hidden mb-4 rounded-xl border border-zinc-700 bg-zinc-800 p-5 shadow"
      >
        <div class="text-sm text-zinc-400">
          Delete server
          <span id="delete-confirm-name" class="font-semibold text-neutral-50"></span>?
        </div>
        <form
          id="delete-confirm-form"
          class="mt-3"
          hx-post="/api/v1/servers/delete"
          hx-ext="json-enc"
          hx-swap="none"
        >
          <label class="flex items-center gap-2 text-sm text-zinc-400">
            <input type="checkbox" name="delete_storage" value="true" />
            Delete saved world too
          </label>
          <div class="mt-2 flex gap-2">
            <button
              type="submit"
              class="rounded-lg bg-red-700 px-4 py-2 text-sm font-medium transition-colors hover:bg-red-600"
            >
              Delete
            </button>
            <button
              type="button"
              class="confirm-no rounded-lg bg-zinc-700 px-4 py-2 text-sm font-medium transition-colors hover:bg-zinc-600"
            >
              Cancel
            </button>
          </div>
          <div
            id="delete-confirm-error"
            class="mt-2 text-sm font-medium text-red-500"
          ></div>
        </form>
      </div>
      <div
        id="server-list"
        class="flex flex-col gap-4"
        hx-get="/api/v1/servers"
        hx-trigger="every 5s"
        hx-headers='{"Accept": "text/html"}'
      >
        {{ template "view" .Servers}}
      </div>
    </main>
  </body>
</html>
{{end}}
